<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-opacity="0.04"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-opacity="0.04"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-opacity="0.04"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-opacity="0.04"/>

  <!-- Icon mark -->
  <rect x="80" y="180" width="80" height="80" rx="20" fill="#1E3A8A"/>
  <rect x="96" y="200" width="48" height="6" rx="3" fill="#10B981"/>
  <rect x="96" y="212" width="36" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="96" y="224" width="42" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="96" y="236" width="28" height="6" rx="3" fill="white" opacity="0.4"/>
  <polyline points="130,246 138,232 146,238" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="180" y="244" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-1" fill="white">LEDGERA</text>

  <!-- Tagline -->
  <text x="80" y="316" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="white" opacity="0.5">Every transaction tells a story.</text>

  <!-- Feature pills -->
  <rect x="80" y="380" width="180" height="40" rx="20" fill="#1E3A8A" opacity="0.6"/>
  <text x="170" y="405" font-family="Inter, system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">POS &amp; Sales</text>

  <rect x="276" y="380" width="180" height="40" rx="20" fill="#1E3A8A" opacity="0.6"/>
  <text x="366" y="405" font-family="Inter, system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">Accounting</text>

  <rect x="472" y="380" width="200" height="40" rx="20" fill="#1E3A8A" opacity="0.6"/>
  <text x="572" y="405" font-family="Inter, system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">Mobile Money</text>

  <rect x="688" y="380" width="180" height="40" rx="20" fill="#1E3A8A" opacity="0.6"/>
  <text x="778" y="405" font-family="Inter, system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">Payroll</text>

  <!-- Chart illustration (right side) -->
  <rect x="820" y="160" width="320" height="200" rx="16" fill="url(#card)" stroke="#1E3A8A" stroke-opacity="0.5"/>
  <text x="840" y="190" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" opacity="0.4">Revenue vs Expenses</text>
  <!-- Bars -->
  <rect x="850" y="290" width="28" height="50" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="850" y="260" width="28" height="30" rx="4" fill="#10B981" opacity="0.8"/>
  <rect x="892" y="270" width="28" height="70" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="892" y="250" width="28" height="20" rx="4" fill="#10B981" opacity="0.8"/>
  <rect x="934" y="280" width="28" height="60" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="934" y="245" width="28" height="35" rx="4" fill="#10B981" opacity="0.8"/>
  <rect x="976" y="265" width="28" height="75" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="976" y="235" width="28" height="30" rx="4" fill="#10B981" opacity="0.8"/>
  <rect x="1018" y="255" width="28" height="85" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="1018" y="220" width="28" height="35" rx="4" fill="#10B981" opacity="0.8"/>
  <rect x="1060" y="245" width="28" height="95" rx="4" fill="#1E3A8A" opacity="0.8"/>
  <rect x="1060" y="210" width="28" height="35" rx="4" fill="#10B981" opacity="0.8"/>

  <!-- Bottom text -->
  <text x="80" y="570" font-family="Inter, system-ui, sans-serif" font-size="18" fill="white" opacity="0.3">Africa-first business management platform for SMEs</text>
</svg>
