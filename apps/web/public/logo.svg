<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Icon mark: ledger book with upward tick -->
  <rect x="2" y="4" width="40" height="40" rx="10" fill="#1E3A8A"/>
  <rect x="10" y="12" width="24" height="2.5" rx="1.25" fill="#10B981"/>
  <rect x="10" y="18" width="18" height="2.5" rx="1.25" fill="white" opacity="0.7"/>
  <rect x="10" y="24" width="21" height="2.5" rx="1.25" fill="white" opacity="0.7"/>
  <rect x="10" y="30" width="15" height="2.5" rx="1.25" fill="white" opacity="0.5"/>
  <!-- Rising arrow -->
  <polyline points="26,34 30,26 34,29" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Wordmark -->
  <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" fill="#1E3A8A">LEDGERA</text>
</svg>
